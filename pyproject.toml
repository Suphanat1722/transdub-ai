[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transdub-ai"
version = "1.6.1"
description = "End-to-end Thai YouTube dubbing with yt-dlp, Gemini, Edge TTS, Demucs and FFmpeg"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Suphanat Rueanthai" }]
dependencies = [
  "alembic==1.16.5",
  "charset-normalizer==3.4.3",
  "curl_cffi==0.16.3",
  "edge-tts==7.2.8",
  "fastapi==0.116.1",
  "google-genai==2.20.0",
  "python-dotenv==1.1.1",
  "python-multipart==0.0.20",
  "soundfile==0.13.1",
  "uvicorn==0.35.0",
  "yt-dlp==2026.8.19",
]

[project.optional-dependencies]
inference = [
  "cached-path==1.8.0",
  "demucs==4.0.1",
]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "pytest-timeout==2.4.0",
]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pre-commit==4.3.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "pytest-timeout==2.4.0",
  "ruff==0.12.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["vendor", "data", "models"]
